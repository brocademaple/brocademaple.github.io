<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>潮汐之间 · Blender 渲染</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#052b3f;color:#fff4d9;font-family:'Songti SC',Georgia,serif}header{padding:22px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:25px;font-weight:400}p{line-height:1.8;color:#d4dfe0}a{color:#ffe3a4}main{max-width:1400px;margin:auto;padding:0 3vw 40px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{font:inherit;color:inherit;background:#08495c;border:1px solid #fbe5b442;border-radius:6px;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:#ead4a4;color:#173840}figure{margin:0}img{display:block;width:100%;height:auto;aspect-ratio:14/9;object-fit:contain;background:#032435}figcaption{margin:12px 0;font-size:14px}small{color:#c3d4d9}.actions{display:flex;gap:18px;flex-wrap:wrap}button:focus-visible,a:focus-visible{outline:2px solid #ffe3a4;outline-offset:4px}@media(max-width:600px){header{align-items:start}h1{font-size:21px}header a{font-size:13px;white-space:nowrap}main{padding:0 4vw 30px}}</style><header><h1>潮汐之间</h1><a href="./?three=1">进入三维画廊 ↗</a></header><main><p>Blender 原始渲染 · V2.4<br><small>固定机位的渲染图片。进入三维画廊可自由行走、环顾与查看作品。</small></p><nav aria-label="渲染机位"></nav><figure><img id="render" src="01-hero.png" alt="新月园区 Blender 渲染"><figcaption id="caption">新月园区</figcaption></figure><div class="actions"><a id="original" href="01-hero.png" target="_blank" rel="noopener">打开原始图片</a><a id="three" href="./?three=1&amp;view=hero">进入这个三维视角</a></div></main><script>const views=[['hero','新月园区','01-hero.png'],['loop','花园环路','02-loop.png'],['glass','玻璃长廊','03-glass.png'],['archive','潮汐档案','04-archive.png']];function show(id){const v=views.find(v=>v[0]===id)||views[0];document.querySelector('#render').src=v[2];document.querySelector('#render').alt=v[1]+' Blender 渲染';document.querySelector('#caption').textContent=v[1];document.querySelector('#original').href=v[2];document.querySelector('#three').href='./?three=1&view='+v[0];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===v[0])))}for(const v of views){const b=document.createElement('button');b.dataset.id=v[0];b.textContent=v[1];b.onclick=()=>show(v[0]);document.querySelector('nav').append(b)}show(new URLSearchParams(location.search).get('view'));</script></html>
